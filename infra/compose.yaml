name: spaceops
services:
  db:
    image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spaceops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-spaceops}
    ports: ['127.0.0.1:5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: { context: .., dockerfile: infra/Dockerfile, target: api }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-spaceops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-spaceops}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
    command:
      [
        'sh',
        '-c',
        'node apps/api/dist/database/cli.js migrate && node apps/api/dist/database/cli.js seed',
      ]
    depends_on: { db: { condition: service_healthy } }
  api:
    build: { context: .., dockerfile: infra/Dockerfile, target: api }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-spaceops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-spaceops}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PORT: 3001
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    build: { context: .., dockerfile: infra/Dockerfile, target: web }
    ports: ['127.0.0.1:8080:80']
    depends_on: { api: { condition: service_healthy } }
    restart: unless-stopped
volumes:
  pgdata:
